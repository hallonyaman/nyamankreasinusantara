<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">

  <title>Terima Kasih | CV Nyaman Kreasi Nusantara</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            nyaman: {
              navy: '#0B2546',
              dark: '#061A32',
              darker: '#041426',
              gold: '#C9A46A',
              goldLight: '#E3C99D'
            }
          },
          fontFamily: {
            sans: ['Montserrat', 'sans-serif']
          }
        }
      }
    };
  </script>

  <!-- GOOGLE ANALYTICS 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-7W3JTQXTSY"></script>

  <script>
    window.dataLayer = window.dataLayer || [];

    function gtag() {
      dataLayer.push(arguments);
    }

    gtag('js', new Date());

    gtag('config', 'G-7W3JTQXTSY');
  </script>
</head>

<body class="font-sans bg-[#041426] text-white min-h-screen flex items-center justify-center px-6">

  <main class="max-w-2xl text-center">

    <p class="text-[#E3C99D] text-xs font-bold tracking-[.2em] uppercase mb-5">
      REQUEST RECEIVED
    </p>

    <h1 class="text-4xl md:text-6xl font-black tracking-[-.04em] mb-6">
      TERIMA KASIH.
    </h1>

    <p class="text-white/70 leading-8 mb-10">
      Permintaan penawaran Anda sudah kami terima.
      Team NYAMAN akan meninjau kebutuhan tersebut dan menghubungi Anda untuk pembahasan lebih lanjut.
    </p>

    <div class="flex flex-col sm:flex-row justify-center gap-4">

      <a
        href="/"
        class="bg-[#C9A46A] text-[#061A32] px-8 py-4 font-bold text-xs tracking-[.08em]"
      >
        KEMBALI KE WEBSITE
      </a>

      <a
        id="thankyou-whatsapp"
        href="https://wa.me/62818595758?text=Halo%20Team%20NYAMAN%2C%20saya%20baru%20saja%20mengirim%20permintaan%20penawaran%20melalui%20website."
        target="_blank"
        rel="noopener"
        class="border border-white/30 px-8 py-4 font-bold text-xs tracking-[.08em]"
      >
        LANJUTKAN VIA WHATSAPP
      </a>

    </div>

  </main>

  <script>
    function trackEvent(eventName, params = {}) {
      if (typeof window.gtag === "function") {
        window.gtag("event", eventName, {
          ...params,
          page_location: window.location.href,
          page_title: document.title
        });
      }
    }

    window.addEventListener("load", function () {
      trackEvent("rfq_success", {
        form_name: "request-quotation"
      });
    });

    const whatsappButton = document.getElementById("thankyou-whatsapp");

    if (whatsappButton) {
      whatsappButton.addEventListener("click", function () {
        trackEvent("click_whatsapp", {
          link_location: "thank_you_page"
        });
      });
    }
  </script>

</body>
</html>
